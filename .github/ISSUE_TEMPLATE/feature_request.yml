name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and why does it matter for a deal desk?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: checkboxes
    id: seam
    attributes:
      label: Scope
      options:
        - label: This touches the runner seam (prompt, brief, tool names) and I have read docs/ARCHITECTURE.md
